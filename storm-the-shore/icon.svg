<!-- Storm the Shore icon: a blue ×2 gate on the beach with the squad running at it.
     Full-bleed 512×512; the important parts sit inside the middle circle (radius 205).
     Then run: node tools/make-icons.js storm-the-shore -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="#d8c08f"/>
  <rect width="512" height="190" fill="#9cb7c9"/>
  <path d="M0 190 L60 160 L130 176 L200 150 L270 170 L350 146 L430 168 L512 152 L512 196 L0 196 Z" fill="#8d8a73"/>
  <path d="M196 196 L316 196 L470 512 L42 512 Z" fill="#b89a66"/>
  <!-- the gate -->
  <rect x="140" y="132" width="232" height="128" rx="10" fill="#2f8fd6"/>
  <rect x="140" y="124" width="232" height="16" rx="6" fill="#1d5f94"/>
  <rect x="132" y="124" width="18" height="150" rx="6" fill="#1d5f94"/>
  <rect x="362" y="124" width="18" height="150" rx="6" fill="#1d5f94"/>
  <text x="256" y="230" text-anchor="middle" font-family="system-ui, Arial, sans-serif" font-weight="900" font-size="104" fill="#ffffff">×2</text>
  <!-- the squad, seen from behind -->
  <g fill="#5d6b33">
    <g transform="translate(196 300)">
      <rect x="-22" y="20" width="44" height="54" rx="12"/><rect x="-16" y="70" width="12" height="40" rx="6" fill="#3c4620"/><rect x="4" y="70" width="12" height="40" rx="6" fill="#3c4620"/>
      <circle cx="0" cy="14" r="15" fill="#e2b48c"/><path d="M-28 10 A28 24 0 0 1 28 10 Z" fill="#4a5527"/><rect x="-30" y="8" width="60" height="6" rx="3" fill="#4a5527"/>
    </g>
    <g transform="translate(316 300)">
      <rect x="-22" y="20" width="44" height="54" rx="12"/><rect x="-16" y="70" width="12" height="40" rx="6" fill="#3c4620"/><rect x="4" y="70" width="12" height="40" rx="6" fill="#3c4620"/>
      <circle cx="0" cy="14" r="15" fill="#e2b48c"/><path d="M-28 10 A28 24 0 0 1 28 10 Z" fill="#4a5527"/><rect x="-30" y="8" width="60" height="6" rx="3" fill="#4a5527"/>
    </g>
    <g transform="translate(256 330) scale(1.15)">
      <rect x="-22" y="20" width="44" height="54" rx="12"/><rect x="-16" y="70" width="12" height="40" rx="6" fill="#3c4620"/><rect x="4" y="70" width="12" height="40" rx="6" fill="#3c4620"/>
      <circle cx="0" cy="14" r="15" fill="#e2b48c"/><path d="M-28 10 A28 24 0 0 1 28 10 Z" fill="#4a5527"/><rect x="-30" y="8" width="60" height="6" rx="3" fill="#4a5527"/>
    </g>
  </g>
</svg>
