<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tablet Tasks</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #f6f5f1; --card: #ffffff; --text: #1d1d1b; --muted: #6b6a65;
    --accent: #c4622d; --border: #e3e1da; --done: #a3a19a;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1b19; --card: #262624; --text: #ecebe6; --muted: #9c9a92;
      --accent: #e0814c; --border: #3a3936; --done: #6f6d66;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .sub { color: var(--muted); margin: 0 0 24px; font-size: 16px; }
  form { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] {
    flex: 1; min-width: 0; padding: 14px 16px; font: inherit; color: inherit;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
  }
  input[type=text]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    font: inherit; border: 0; border-radius: 12px; cursor: pointer;
    min-height: 48px; padding: 0 20px;
  }
  .add { background: var(--accent); color: #fff; font-weight: 600; }
  .filters { display: flex; gap: 8px; margin-bottom: 12px; }
  .filters button { background: transparent; color: var(--muted); padding: 0 14px; border: 1px solid var(--border); }
  .filters button[aria-pressed=true] { color: var(--text); border-color: var(--text); }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex; align-items: center; gap: 12px; padding: 8px 8px 8px 16px;
    background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px;
  }
  li input[type=checkbox] { width: 26px; height: 26px; margin: 0; accent-color: var(--accent); flex: none; }
  .tick { display: grid; place-items: center; width: 48px; height: 48px; margin: -8px -6px -8px -14px; flex: none; cursor: pointer; }
  li span { flex: 1; overflow-wrap: anywhere; }
  li.done span { color: var(--done); text-decoration: line-through; }
  .del { background: transparent; color: var(--muted); font-size: 24px; padding: 0 14px; }
  .footer { display: flex; justify-content: space-between; align-items: center; color: var(--muted); font-size: 16px; margin-top: 12px; }
  .footer button { background: transparent; color: var(--muted); min-height: 48px; padding: 0 8px; }
  .updates { margin: 28px 0 0; text-align: center; }
  .updates button { background: transparent; border: 0; color: var(--muted); min-height: 44px; padding: 0 12px; text-decoration: underline; text-underline-offset: 3px; }
  .empty { color: var(--muted); text-align: center; padding: 32px 0; }
</style>
</head>
<body>
<main>
  <h1>Tablet Tasks</h1>
  <p class="sub">A small to-do list, sized for touch. Saved in this browser.</p>

  <form id="form">
    <input id="input" type="text" placeholder="Add a task…" autocomplete="off" aria-label="New task">
    <button class="add" type="submit">Add</button>
  </form>

  <div class="filters" role="group" aria-label="Filter">
    <button data-filter="all" aria-pressed="true">All</button>
    <button data-filter="active" aria-pressed="false">Active</button>
    <button data-filter="done" aria-pressed="false">Done</button>
  </div>

  <ul id="list"></ul>
  <p id="empty" class="empty" hidden>Nothing here yet.</p>

  <div class="footer">
    <span id="count"></span>
    <button id="clear" type="button">Clear done</button>
  </div>
  <p class="updates"><button type="button" data-check-updates>Check for updates</button></p>
</main>

<script>
  const KEY = 'tablet-tasks';
  const load = () => { try { return JSON.parse(localStorage.getItem(KEY)) || []; } catch { return []; } };
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(tasks)); } catch {} };

  let tasks = load();
  if (!tasks.length) {
    tasks = [
      { id: 1, text: 'Try Claude Code from my tablet', done: true },
      { id: 2, text: 'Ask for a new feature', done: false },
      { id: 3, text: 'Push the changes to GitHub', done: false },
    ];
  }
  let filter = 'all';

  const $ = id => document.getElementById(id);

  function render() {
    const shown = tasks.filter(t => filter === 'all' || (filter === 'done' ? t.done : !t.done));
    $('list').replaceChildren(...shown.map(t => {
      const li = document.createElement('li');
      li.className = t.done ? 'done' : '';
      const cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = t.done; cb.setAttribute('aria-label', 'Mark done');
      cb.onchange = () => { t.done = cb.checked; update(); };
      const tick = document.createElement('label');   // a finger-sized area around the box
      tick.className = 'tick'; tick.append(cb);
      const span = document.createElement('span');
      span.textContent = t.text;
      const del = document.createElement('button');
      del.className = 'del'; del.textContent = '×'; del.setAttribute('aria-label', 'Delete task');
      del.onclick = () => { tasks = tasks.filter(x => x !== t); update(); };
      li.append(tick, span, del);
      return li;
    }));
    $('empty').hidden = shown.length > 0;
    const left = tasks.filter(t => !t.done).length;
    $('count').textContent = `${left} task${left === 1 ? '' : 's'} left`;
  }

  function update() { save(); render(); }

  $('form').onsubmit = e => {
    e.preventDefault();
    const text = $('input').value.trim();
    if (!text) return;
    tasks.push({ id: Date.now(), text, done: false });
    $('input').value = '';
    update();
  };

  document.querySelectorAll('[data-filter]').forEach(b => b.onclick = () => {
    filter = b.dataset.filter;
    document.querySelectorAll('[data-filter]').forEach(x => x.setAttribute('aria-pressed', x === b));
    render();
  });

  $('clear').onclick = () => { tasks = tasks.filter(t => !t.done); update(); };

  render();

</script>
<!-- App updates: the same block in every app (copy it from _template/index.html). It registers the
     service worker, shows a bar with Restart when a new version has downloaded, re-checks when the
     app comes back to the front, and any button with data-check-updates checks straight away.
     To save before a restart, set window.appUpdates = { beforeRestart: () => save() } before this. -->
<div class="app-update" id="app-update" role="status" aria-live="polite" hidden>
  <span id="app-update-text"></span>
  <button type="button" id="app-update-go" hidden>Restart</button>
  <button type="button" id="app-update-x" aria-label="Close">✕</button>
</div>
<style>
  .app-update { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1000;
    display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px); padding: 6px 6px 6px 18px; border-radius: 999px;
    background: rgba(18, 24, 30, 0.95); color: #fff; font: 600 15px/1.3 system-ui, sans-serif; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
  .app-update[hidden] { display: none; }
  .app-update button { min-height: 44px; margin: 0; border: 0; border-radius: 999px; font: inherit; cursor: pointer; }
  #app-update-go { padding: 0 20px; background: #fff; color: #12181e; }
  #app-update-x { width: 44px; padding: 0; background: transparent; color: rgba(255, 255, 255, 0.7); font-size: 17px; }
</style>
<script>
(() => {
  const bar = document.getElementById('app-update'), text = document.getElementById('app-update-text'), go = document.getElementById('app-update-go');
  let ready = false, timer = 0, lastCheck = Date.now();
  const show = (msg, restart) => {
    text.textContent = msg; go.hidden = !restart; bar.hidden = false;
    clearTimeout(timer); if (!restart) timer = setTimeout(() => { bar.hidden = true; }, 4000);
  };
  const api = window.appUpdates = Object.assign(window.appUpdates || {}, {
    check: async () => { show('Updates need the app to be opened from the web.'); return 'none'; },
    restart() { try { if (api.beforeRestart) api.beforeRestart(); } catch {} location.reload(); },
  });
  go.onclick = () => api.restart();
  document.getElementById('app-update-x').onclick = () => { bar.hidden = true; };
  document.addEventListener('click', e => { if (e.target.closest('[data-check-updates]')) api.check(); });
  const sw = 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) ? navigator.serviceWorker : null;
  if (!sw) return;
  window.addEventListener('load', () => { sw.register('sw.js').catch(() => { /* The app still works online without it. */ }); });
  // A new version has downloaded and taken over: offer a restart. (The very first install doesn't count.)
  let controlled = !!sw.controller;
  sw.addEventListener('controllerchange', () => {
    if (!controlled) { controlled = true; return; }
    if (!ready) { ready = true; show('A new version is ready.', true); }
  });
  // This app's installed version, from its cache name (<slug>-v<N>).
  const version = async () => {
    const slug = location.pathname.split('/').filter(x => x && !x.includes('.')).pop();
    const ns = (await caches.keys()).map(k => (k.match(new RegExp(`^${slug}-v(\\d+)$`)) || [])[1]).filter(Boolean).map(Number);
    return ns.length ? Math.max(...ns) : null;
  };
  // Look again when the app comes back to the front, at most every 30 minutes.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || Date.now() - lastCheck < 30 * 60 * 1000) return;
    lastCheck = Date.now();
    sw.getRegistration().then(r => r && r.update()).catch(() => {});
  });
  api.check = async () => {
    if (ready) { show('A new version is ready.', true); return 'ready'; }
    show('Checking for updates…');
    try {
      const reg = await sw.getRegistration();
      if (!reg) { show('Updates start once the app has loaded online.'); return 'none'; }
      await reg.update(); lastCheck = Date.now();
      if (ready) return 'ready';
      if (reg.installing || reg.waiting) { show('Downloading the new version…'); return 'downloading'; }
      const v = await version().catch(() => null);
      show(`You have the latest version${v ? ` (version ${v})` : ''}.`); return 'latest';
    } catch { show('Couldn’t check for updates. Are you online?'); return 'offline'; }
  };
})();
</script>
</body>
</html>
