<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>__APP_NAME__</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="__BG_COLOR__" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="__BG_COLOR_DARK__" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<style>
  /* Theme tokens: light values on :root, dark values in the two blocks below.
     Style everything through these tokens so both themes stay readable. */
  :root {
    --bg: __BG_COLOR__; --panel: #ffffff; --ink: #1b2328; --muted: #5d6970; --line: #d7dde0;
    --accent: __THEME_COLOR__; --on-accent: #ffffff;
    --font-body: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --radius: 14px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: __BG_COLOR_DARK__; --panel: #1b2226; --ink: #e3e9ec; --muted: #9aa8af; --line: #2f3a40;
      --on-accent: #ffffff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: __BG_COLOR_DARK__; --panel: #1b2226; --ink: #e3e9ec; --muted: #9aa8af; --line: #2f3a40;
    --on-accent: #ffffff;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { overscroll-behavior: none; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 17px/1.45 var(--font-body);
    -webkit-tap-highlight-color: transparent; overscroll-behavior: none;
  }
  /* Feel like an app: no text selection or long-press menus on controls. */
  button { -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }

  /* Side gutters clear the tablet's screen edges and system bars. */
  .wrap {
    max-width: 960px; margin: 0 auto; display: grid; gap: 20px;
    padding-block: max(20px, env(safe-area-inset-top, 0px)) max(32px, env(safe-area-inset-bottom, 0px));
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.1; margin: 0; }
  button {
    font: inherit; color: inherit; cursor: pointer; border-radius: 12px;
    min-height: 48px; padding: 0 18px; border: 1px solid var(--line); background: var(--panel);
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .primary { background: var(--accent); color: var(--on-accent); border-color: transparent; font-weight: 700; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; }
  .updates { margin: 0; text-align: center; }
  .updates button { background: transparent; border-color: transparent; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>__APP_NAME__</h1>
  <div class="card">
    <p>Replace this with the app.</p>
    <button type="button" class="primary" id="hello">Tap me</button>
  </div>
  <p class="updates"><button type="button" data-check-updates>Check for updates</button></p>
</div>

<script>
(() => {
  // Use a storage key unique to this app: every app on the site shares one origin.
  const STORE = '__APP_SLUG__';
  const load = () => { try { return JSON.parse(localStorage.getItem(STORE)) || {}; } catch { return {}; } };
  const save = data => { try { localStorage.setItem(STORE, JSON.stringify(data)); } catch {} };

  const state = load();
  const btn = document.getElementById('hello');
  const show = () => { btn.textContent = state.taps ? `Tapped ${state.taps} times` : 'Tap me'; };
  btn.onclick = () => { state.taps = (state.taps || 0) + 1; save(state); show(); };
  show();

})();
</script>
<!-- App updates: the same block in every app (copy it from _template/index.html). It registers the
     service worker, shows a bar with Restart when a new version has downloaded, re-checks when the
     app comes back to the front, and any button with data-check-updates checks straight away.
     To save before a restart, set window.appUpdates = { beforeRestart: () => save() } before this. -->
<div class="app-update" id="app-update" role="status" aria-live="polite" hidden>
  <span id="app-update-text"></span>
  <button type="button" id="app-update-go" hidden>Restart</button>
  <button type="button" id="app-update-x" aria-label="Close">✕</button>
</div>
<style>
  .app-update { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 1000;
    display: flex; align-items: center; gap: 10px; width: max-content; max-width: calc(100% - 32px); padding: 6px 6px 6px 18px; border-radius: 999px;
    background: rgba(18, 24, 30, 0.95); color: #fff; font: 600 15px/1.3 system-ui, sans-serif; box-shadow: 0 8px 30px rgba(0, 0, 0, 0.35); }
  .app-update[hidden] { display: none; }
  .app-update button { min-height: 44px; margin: 0; border: 0; border-radius: 999px; font: inherit; cursor: pointer; }
  #app-update-go { padding: 0 20px; background: #fff; color: #12181e; }
  #app-update-x { width: 44px; padding: 0; background: transparent; color: rgba(255, 255, 255, 0.7); font-size: 17px; }
</style>
<script>
(() => {
  const bar = document.getElementById('app-update'), text = document.getElementById('app-update-text'), go = document.getElementById('app-update-go');
  let ready = false, timer = 0, lastCheck = Date.now();
  const show = (msg, restart) => {
    text.textContent = msg; go.hidden = !restart; bar.hidden = false;
    clearTimeout(timer); if (!restart) timer = setTimeout(() => { bar.hidden = true; }, 4000);
  };
  const api = window.appUpdates = Object.assign(window.appUpdates || {}, {
    check: async () => { show('Updates need the app to be opened from the web.'); return 'none'; },
    restart() { try { if (api.beforeRestart) api.beforeRestart(); } catch {} location.reload(); },
  });
  go.onclick = () => api.restart();
  document.getElementById('app-update-x').onclick = () => { bar.hidden = true; };
  document.addEventListener('click', e => { if (e.target.closest('[data-check-updates]')) api.check(); });
  const sw = 'serviceWorker' in navigator && /^https?:$/.test(location.protocol) ? navigator.serviceWorker : null;
  if (!sw) return;
  window.addEventListener('load', () => { sw.register('sw.js').catch(() => { /* The app still works online without it. */ }); });
  // A new version has downloaded and taken over: offer a restart. (The very first install doesn't count.)
  let controlled = !!sw.controller;
  sw.addEventListener('controllerchange', () => {
    if (!controlled) { controlled = true; return; }
    if (!ready) { ready = true; show('A new version is ready.', true); }
  });
  // This app's installed version, from its cache name (<slug>-v<N>).
  const version = async () => {
    const slug = location.pathname.split('/').filter(x => x && !x.includes('.')).pop();
    const ns = (await caches.keys()).map(k => (k.match(new RegExp(`^${slug}-v(\\d+)$`)) || [])[1]).filter(Boolean).map(Number);
    return ns.length ? Math.max(...ns) : null;
  };
  // Look again when the app comes back to the front, at most every 30 minutes.
  document.addEventListener('visibilitychange', () => {
    if (document.hidden || Date.now() - lastCheck < 30 * 60 * 1000) return;
    lastCheck = Date.now();
    sw.getRegistration().then(r => r && r.update()).catch(() => {});
  });
  api.check = async () => {
    if (ready) { show('A new version is ready.', true); return 'ready'; }
    show('Checking for updates…');
    try {
      const reg = await sw.getRegistration();
      if (!reg) { show('Updates start once the app has loaded online.'); return 'none'; }
      await reg.update(); lastCheck = Date.now();
      if (ready) return 'ready';
      if (reg.installing || reg.waiting) { show('Downloading the new version…'); return 'downloading'; }
      const v = await version().catch(() => null);
      show(`You have the latest version${v ? ` (version ${v})` : ''}.`); return 'latest';
    } catch { show('Couldn’t check for updates. Are you online?'); return 'offline'; }
  };
})();
</script>
</body>
</html>
