<!-- App icon source. Draw on the full 512×512 square (the background must reach every edge).
     Keep anything important inside the middle circle (radius 205 around 256,256):
     Android crops icons to circles, squircles and other shapes.
     Then run: node tools/make-icons.js <app-folder> -->
<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <rect width="512" height="512" fill="__THEME_COLOR__"/>
  <circle cx="256" cy="256" r="120" fill="#ffffff"/>
</svg>
